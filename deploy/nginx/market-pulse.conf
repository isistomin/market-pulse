# Subdomain server block for the dashboard.
#
# Install on the host that already terminates TLS:
#   sudo cp deploy/nginx/market-pulse.conf /etc/nginx/sites-available/market-pulse
#   sudo ln -s /etc/nginx/sites-available/market-pulse /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace market-pulse.example.com with the real subdomain and point the
# certificate paths at whatever certbot issued for it.
#
# Only this block is public. The API listens on 127.0.0.1:8000 and Airflow on
# 127.0.0.1:8080; neither is reachable from outside the host. Airflow is not
# proxied on purpose: it runs arbitrary code by design, so it is reached over an
# SSH tunnel instead:
#   ssh -L 8080:127.0.0.1:8080 user@host

server {
    listen 80;
    listen [::]:80;
    server_name market-pulse.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name market-pulse.example.com;

    ssl_certificate     /etc/letsencrypt/live/market-pulse.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/market-pulse.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The page loads no third-party assets, so everything may come from this origin.
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    server_tokens off;

    # Built by `npm run build` in web/ and copied here.
    root /var/www/market-pulse;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Read-only JSON API. Only GET is forwarded; anything else is refused here
    # rather than relying on the application to reject it.
    location /api/ {
        limit_except GET HEAD {
            deny all;
        }

        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        limit_req zone=market_pulse_api burst=20 nodelay;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }
}
