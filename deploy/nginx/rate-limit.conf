# Rate limit zone used by the /api/ location.
#
# limit_req_zone only works in the http context, so this goes next to the other
# global snippets rather than inside the server block:
#   sudo cp deploy/nginx/rate-limit.conf /etc/nginx/conf.d/market-pulse-rate-limit.conf
#
# 10 requests per second per address, with a 20 request burst. The dashboard makes
# two calls per interaction, so this is far above normal use and still caps a
# scraper hammering the endpoint.

limit_req_zone $binary_remote_addr zone=market_pulse_api:10m rate=10r/s;
