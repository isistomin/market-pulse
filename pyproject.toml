[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-pulse"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "yfinance>=1.6.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "confluent-kafka>=2.15.0",
    "websockets>=17.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "apache-airflow-task-sdk>=1.0",
    "apache-airflow-providers-standard>=1.0",
]

[tool.setuptools]
packages = ["ingestion", "ingestion.stocks", "ingestion.crypto", "analytics", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: calls an external API"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
